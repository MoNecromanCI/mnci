# The mnci Go modules on every OS, and the golden path end to end. Hand-written
# (not generated by the overlay), so `mnci upgrade` leaves it alone.
name: golden-path

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: golden-path-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: '**/go.sum'
      - name: Vet and test every module
        shell: bash
        run: |
          set -e
          # Every module go.work uses, so a new plugin is tested without
          # listing it here.
          for m in $(go work edit -json | sed -n 's/.*"DiskPath": "\.\/\(.*\)".*/\1/p'); do
            echo "::group::$m"
            (cd "$m" && go vet ./... && go test -race=false ./...)
            echo "::endgroup::"
          done

  golden-path:
    name: golden path (${{ matrix.os }})
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The dotnet plugin's e2e builds for .NET 10.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # The ruby plugin's e2e.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      # The php plugin's e2e.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - name: New workspace, every kind in every language, build, test, release
        working-directory: apps/mnci
        run: go test -tags e2e -timeout 40m -v -skip 'TestConvert' ./goldenpath

  convert:
    name: convert (${{ matrix.os }})
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert an Nx workspace and an old-mnci workspace, then build and plan a release
        working-directory: apps/mnci
        run: go test -tags e2e -timeout 85m -v -run TestConvert ./goldenpath
