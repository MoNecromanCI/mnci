# Generated by mnci from the workspace's projects. `mnci add` and `mnci ci generate`
# rewrite this file: put your own steps between the mnci:slot markers, which are kept.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - name: Install mnci
        run: curl -fsSL https://raw.githubusercontent.com/MoNecromanCI/mnci/main/install.sh | sh -s -- "$MNCI_VERSION"
        env:
          MNCI_VERSION: latest
      # mnci:slot before-setup
      # This repository is mnci: every step below runs the mnci built from this commit.
      - name: Build mnci from this commit
        run: go build -o "$HOME/.local/bin/mnci" ./apps/mnci
      # mnci:slot-end before-setup
      - name: Setup
        run: mnci ci setup
      - name: Audit
        run: mnci ci audit
      - name: Verify
        run: mnci ci verify
      # mnci:slot after-verify
      # mnci:slot-end after-verify
      - name: Release preview
        if: github.event_name == 'pull_request'
        run: mnci release --dry-run
      - name: Release
        if: github.event_name == 'push' && github.ref_name == 'main'
        run: mnci ci release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
