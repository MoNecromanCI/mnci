#:schema https://raw.githubusercontent.com/MoNecromanCI/mnci/main/apps/mnci/workspace/mnci.schema.json
# mnci workspace configuration. Written by `mnci convert`; edit it freely or with the TUI.
# Every setting is optional except [workspace] name; see docs/configuration.md.
schema = 1

[workspace]
name = "mnci"
scope = "@mnci"
module_prefix = "github.com/MoNecromanCI/mnci"

[ci]
providers = ["github"]

# Every Go project gets a slice-check task, run before lint: role-named files,
# no junk-drawer folders (see docs/conventions.md).
[conventions.vertical-slices]

[tasks.lint]
command = ["golangci-lint", "run", "--allow-serial-runners"]

[release]
github_releases = true

[projects.mnci.release]
asset_name = "{product}_{version}_{os}_{arch}.{ext}"
product = "mnci"
# Attached to each GitHub Release, ready for a tap, a bucket and winget-pkgs.
package_managers = ["homebrew", "scoop", "winget"]
# Published from the same archives: npm i -g mnci (or @mnci/cli), and
# pipx install mnci / uvx mnci.
npm = ["@mnci/cli", "mnci"]
pypi = "mnci"
description = "Runs a monorepo in Node, Go and Python: tasks from a cache, CI and releases"
license = "MIT"

[projects.mnci.tasks.build-dev]
command = ["go", "build", "-gcflags=all=-N -l", "-o", "../../dist/dev/apps/mnci/mnci", "."]
outputs = ["../../dist/dev/apps/mnci"]

[projects.mnci.tasks.dev]
command = ["go", "run", "github.com/air-verse/air@v1.61.7", "--build.cmd", "go build ./...", "--build.bin", "go run .", "--build.exclude_dir", "tmp"]

[projects.mnci.tasks.start]
command = ["go", "run", "."]
